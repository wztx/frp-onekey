name: Sync FRP Releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-frp-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check for new FRP release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_API_URL: https://api.github.com/repos/fatedier/frp/releases/latest
        run: |
          set -euo pipefail

          upstream_tag="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -u "x-access-token:${GH_TOKEN}" \
              "$RELEASE_API_URL" \
            | jq -r '.tag_name'
          )"

          if [ -z "$upstream_tag" ] || [ "$upstream_tag" = "null" ]; then
            echo "::error::Unable to determine the latest FRP release tag."
            exit 1
          fi

          echo "Upstream latest tag: $upstream_tag"

          existing_tag="$(gh release view "$upstream_tag" --json tagName -q '.tagName' 2>/dev/null || true)"

          if [ "$existing_tag" = "$upstream_tag" ]; then
            echo "Release $upstream_tag already exists. Skipping sync."
            echo "new_version=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected: $upstream_tag"
            echo "new_version=true" >> "$GITHUB_OUTPUT"
          fi

          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

      - name: Download latest FRP release assets
        id: frp
        if: steps.check.outputs.new_version == 'true'
        env:
          API_TOKEN: ${{ github.token }}
          RELEASE_API_URL: https://api.github.com/repos/fatedier/frp/releases/latest
        run: |
          set -euo pipefail

          release_dir="frp-releases"
          release_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -u "x-access-token:${API_TOKEN}" \
              "$RELEASE_API_URL"
          )"
          tag_name="$(printf '%s' "$release_json" | jq -r '.tag_name')"
          release_name="$(printf '%s' "$release_json" | jq -r '.name // empty')"
          release_page_url="$(printf '%s' "$release_json" | jq -r '.html_url // empty')"
          release_body="$(printf '%s' "$release_json" | jq -r '.body // empty')"

          if [ -z "$tag_name" ] || [ "$tag_name" = "null" ]; then
            echo "::error::Unable to determine the latest FRP release tag."
            exit 1
          fi

          target_dir="$release_dir/$tag_name"
          mkdir -p "$target_dir"

          mapfile -t assets < <(
            printf '%s' "$release_json" | jq -r '
              .assets[]
              | [.name, .browser_download_url]
              | @tsv
            '
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found for $tag_name."
            exit 1
          fi

          find "$target_dir" -maxdepth 1 -type f ! -name '.gitkeep' -delete

          echo "Syncing ${#assets[@]} release assets for $tag_name into $target_dir"

          for asset in "${assets[@]}"; do
            IFS=$'\t' read -r asset_name asset_url <<<"$asset"
            echo "Downloading $asset_name"
            curl -fL --retry 3 --retry-delay 2 --output "$target_dir/$asset_name" "$asset_url"
          done

          notes_file="$(mktemp)"
          {
            if [ -n "$release_page_url" ]; then
              printf 'Synced from upstream [%s](%s).\n\n' "${release_name:-$tag_name}" "$release_page_url"
            else
              printf 'Synced from upstream FRP release %s.\n\n' "$tag_name"
            fi

            if [ -n "$release_body" ]; then
              printf '%s\n' "$release_body"
            else
              printf 'Upstream release notes were not provided.\n'
            fi
          } > "$notes_file"

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name:-$tag_name}" >> "$GITHUB_OUTPUT"
          echo "target_dir=$target_dir" >> "$GITHUB_OUTPUT"
          echo "notes_file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        if: steps.check.outputs.new_version == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.frp.outputs.tag_name }}
          RELEASE_NAME: ${{ steps.frp.outputs.release_name }}
          TARGET_DIR: ${{ steps.frp.outputs.target_dir }}
          NOTES_FILE: ${{ steps.frp.outputs.notes_file }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          assets=("$TARGET_DIR"/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No release assets found in $TARGET_DIR."
            exit 1
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME" --notes-file "$NOTES_FILE"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" --title "$RELEASE_NAME" --notes-file "$NOTES_FILE"
          fi

      - name: Commit and push changes when assets change
        if: steps.check.outputs.new_version == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frp-releases

          if git diff --cached --quiet; then
            echo "No FRP release asset changes detected."
            exit 0
          fi

          git commit -m "chore: sync frp release assets"
          git push
