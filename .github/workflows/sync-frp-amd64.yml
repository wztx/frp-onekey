name: Sync FRP AMD64 Releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-frp-amd64
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download latest FRP AMD64 assets
        env:
          API_TOKEN: ${{ github.token }}
          RELEASE_API_URL: https://api.github.com/repos/fatedier/frp/releases/latest
        run: |
          set -euo pipefail

          release_dir="frp-releases"
          release_json="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -u "x-access-token:${API_TOKEN}" \
              "$RELEASE_API_URL"
          )"
          tag_name="$(printf '%s' "$release_json" | jq -r '.tag_name')"

          if [ -z "$tag_name" ] || [ "$tag_name" = "null" ]; then
            echo "::error::Unable to determine the latest FRP release tag."
            exit 1
          fi

          target_dir="$release_dir/$tag_name"
          mkdir -p "$target_dir"

          mapfile -t assets < <(
            printf '%s' "$release_json" | jq -r '
              .assets[]
              | select(.name | test("amd64"; "i"))
              | [.name, .browser_download_url]
              | @tsv
            '
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No AMD64 assets found for $tag_name."
            exit 1
          fi

          find "$target_dir" -maxdepth 1 -type f ! -name '.gitkeep' -delete

          echo "Syncing ${#assets[@]} AMD64 assets for $tag_name into $target_dir"

          for asset in "${assets[@]}"; do
            IFS=$'\t' read -r asset_name asset_url <<<"$asset"
            echo "Downloading $asset_name"
            curl -fL --retry 3 --retry-delay 2 --output "$target_dir/$asset_name" "$asset_url"
          done

      - name: Commit and push changes when assets change
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add frp-releases

          if git diff --cached --quiet; then
            echo "No FRP AMD64 asset changes detected."
            exit 0
          fi

          git commit -m "chore: sync frp amd64 release assets"
          git push
